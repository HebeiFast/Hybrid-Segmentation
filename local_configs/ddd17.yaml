MODEL:
  BACKBONE:
    NAME: "ERViT_Tiny"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  ERVIT:
    STEM_CHS: [32, 16, 32]
    DEPTHS: [3, 4, 3, 2]
    PATH_DROPOUT: 0.2
    ATTN_DROP: 0
    DROP: 0
    STRIDES: [1, 2, 2, 2]
    SR_RATIOS: [8, 4, 2, 1]
    HEAD_DIM: 8
    MIX_BLOCK_RATIO: 0.75
    USE_CHECKPOINT: False
    RESUME: ""
    WITH_EXTRA_NORM: True
    FROZEN_STAGES: -1
    NORM_EVAL: False
    NORM_CFG: null
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    MODE: double
    FUSION: fusion
  META_ARCHITECTURE: "ERViT_MaskFormer"
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 6
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 64
    MASK_DIM: 64
    NORM: "GN"
    # pixel decoder
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 3
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 64
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 64
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 4
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: True
      INSTANCE_ON: False
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

DATASETS:
  TRAIN: ("ddd17_sem_seg_train",)
  TEST: ("ddd17_sem_seg_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  MAX_ITER: 50000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  BACKBONE_MULTIPLIER: 1.0
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
INPUT:
  EVENT:
    RECURRENT_TIME: 5
    NUMBER_BINS: 5
    SEPARATE_POLARITY: False
    SYMMETRY: False
    NORM: True
  MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 256) for x in range(5, 40)]"]
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 200
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 346
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (256, 256)
    SINGLE_CATEGORY_MAX_AREA: 1.0
  COLOR_AUG_SSD: True
  SIZE_DIVISIBILITY: 256 # used in dataset mapper
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "EventRepSemanticDatasetMapper"
TEST:
  EVAL_PERIOD: 5000
  AUG:
    ENABLED: False
    MIN_SIZES: [256, 384, 512, 640, 768, 896]
    MAX_SIZE: 3584
    FLIP: True
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
VERSION: 2
